name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: E2E Tests with Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu angle_swiftshader -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run E2E Tests with Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu angle_swiftshader -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Wait for emulator to be ready
            adb wait-for-device
            sleep 10
            
            # Create screenshots directory
            mkdir -p screenshots/e2e
            
            # Run E2E tests
            python3 scripts/run_e2e_screenshots.py || true
            
            # Ensure screenshots exist
            ls -la screenshots/e2e/ || mkdir -p screenshots/e2e

      - name: Zip Screenshots
        if: always()
        run: |
          if [ -d "screenshots/e2e" ] && [ "$(ls -A screenshots/e2e 2>/dev/null)" ]; then
            cd screenshots/e2e
            zip -r ../screenshots.zip .
            cd ..
            echo "screenshots.zip created: $(ls -lh screenshots.zip)"
          else
            echo "No screenshots found, creating empty archive"
            mkdir -p screenshots/e2e
            touch screenshots/e2e/.gitkeep
            cd screenshots/e2e
            zip -r ../screenshots.zip .
          fi

      - name: Upload Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/screenshots.zip
          retention-days: 30

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7
          if-no-files-found: ignore
